<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Moodle Grader</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h1>Moodle Grader</h1>
    <div class="actions">
      <button id="refresh" title="Re-scan the active Moodle page">Refresh</button>
      <a id="opts" href="options.html" target="_blank">Options</a>
    </div>
  </header>

  <div id="status" class="status"></div>
  <div id="empty" class="empty hidden">
    No short-answer questions detected on this page. Open a quiz attempt review with essay or short-answer questions, then click Refresh.
  </div>
  <main id="cards"></main>

  <template id="card-tpl">
    <article class="card">
      <header class="card-h">
        <span class="qno"></span>
        <span class="qtype"></span>
        <span class="qmax"></span>
      </header>
      <details class="qtext-wrap">
        <summary>Question text</summary>
        <div class="qtext"></div>
        <ul class="subs"></ul>
      </details>
      <details class="resp-wrap" open>
        <summary>Student response</summary>
        <pre class="resp"></pre>
      </details>
      <button class="grade-btn">Grade with AI</button>
      <div class="result hidden">
        <div class="conf"></div>
        <table class="breakdown"><thead><tr><th>Sub</th><th>Awarded</th><th>Max</th><th>Reason</th></tr></thead><tbody></tbody></table>
        <p class="summary"></p>
        <div class="apply-row">
          <label>Mark <input type="number" step="0.01" min="0" class="mark-input"></label>
          <label class="comment-label">Comment <textarea class="comment-input" rows="2"></textarea></label>
          <button class="apply-btn">Apply in Moodle</button>
        </div>
      </div>
      <div class="err hidden"></div>
    </article>
  </template>

  <script src="sidepanel.js" type="module"></script>
</body>
</html>
