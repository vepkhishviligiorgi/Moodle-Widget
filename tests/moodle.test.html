<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>moodle.js tests</title>
<style>body{font:13px/1.4 system-ui,sans-serif;padding:16px;}.ok{color:#1a7f37}.fail{color:#cf222e;font-weight:600}</style>
</head>
<body>
<h1>moodle.js tests</h1>
<pre id="out"></pre>
<script src="../src/lib/moodle.js"></script>
<script>
const out = document.getElementById("out");
let pass = 0, fail = 0;

function eq(name, got, want) {
  const ok = JSON.stringify(got) === JSON.stringify(want);
  out.innerHTML += (ok ? '<span class="ok">PASS</span> ' : '<span class="fail">FAIL</span> ') + name + "\n";
  if (!ok) out.innerHTML += "  got:  " + JSON.stringify(got) + "\n  want: " + JSON.stringify(want) + "\n";
  ok ? pass++ : fail++;
}
function approx(name, cond, detail) {
  out.innerHTML += (cond ? '<span class="ok">PASS</span> ' : '<span class="fail">FAIL</span> ') + name + (detail ? "  " + detail : "") + "\n";
  cond ? pass++ : fail++;
}

(async () => {
  const res = await fetch("fixtures/review_essay_image.html");
  const html = await res.text();
  const doc = new DOMParser().parseFromString(html, "text/html");
  const qs = MoodleGrader.findQuestions(doc, "https://moodle.example.com/mod/quiz/review.php?attempt=101");

  eq("only essay detected (MCQ skipped)", qs.length, 1);
  const q = qs[0];
  eq("slot extracted", q.slot, 2);
  eq("type", q.type, "essay");
  eq("max mark", q.maxMark, 1.0);
  eq("current mark", q.currentMark, 0.5);
  eq("sub marks parsed", q.subMarks, [0.25, 0.25, 0.5]);
  eq("sub questions count", q.subQuestions.length, 3);
  approx("first sub-q mentions black arrow", /black arrow/i.test(q.subQuestions[0].text), q.subQuestions[0].text);
  approx("second sub-q mentions phase", /phase/i.test(q.subQuestions[1].text), q.subQuestions[1].text);
  approx("third sub-q mentions function", /function/i.test(q.subQuestions[2].text), q.subQuestions[2].text);
  eq("one image extracted", q.images.length, 1);
  approx("image src absolute", q.images[0].src.startsWith("https://moodle.example.com/"), q.images[0].src);
  approx("response captured", /corpus luteum/i.test(q.studentResponse), q.studentResponse.slice(0, 80));
  approx("override URL captured", /comment\.php/.test(q.overrideUrl || ""), q.overrideUrl);

  eq("parseSubMarks empty", MoodleGrader.parseSubMarks(""), []);
  eq("parseSubMarks ignores huge numbers", MoodleGrader.parseSubMarks("(101) (0.5)"), [0.5]);

  out.innerHTML += `\n${pass} passed, ${fail} failed.\n`;
})();
</script>
</body>
</html>
